kind = "web"
previewPath = "/"
title = "Align — Personal Planning"
description = "An adaptive personal planning workspace connecting goals, realistic weekly commitments, actual outcomes, and thoughtful reviews."
version = "1.0.0"
id = "artifacts/adaptive-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23125

[services.development]
run = "pnpm --filter @workspace/adaptive-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adaptive-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/adaptive-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23125"
BASE_PATH = "/"
