openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      responses:
        "200":
          description: Assistant configuration (no credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"
  /ai/chat:
    post:
      operationId: chatWithPlanner
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiConversationInput"
      responses:
        "200":
          description: SSE events text, proposal, error, done; proposals never apply automatically
          content:
            text/event-stream:
              schema:
                type: string
  /ai/apply:
    post:
      operationId: applyAiOperations
      tags: [ai]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiApprovalInput"
      responses:
        "200":
          description: Validated atomic workspace transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiApprovalResult"
        "400":
          description: Invalid or stale relationships; nothing applied
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AiStatus:
      type: object
      required: [configured, model]
      properties:
        configured: { type: boolean }
        model: { type: string }
    AiOperation:
      type: object
      required: [key, type]
      properties:
        key: { type: string, minLength: 1, maxLength: 150 }
        type:
          type: string
          enum: [create_goal, update_goal, create_strategy, update_strategy, create_milestone, update_milestone, create_task, update_task, link_task_to_goal, create_weekly_plan, reschedule_task, record_metric, create_review]
        title: { type: string, maxLength: 300 }
        goalId: { type: string }
        taskId: { type: string }
        milestoneId: { type: string }
        parentTaskId: { type: string }
        outcome: { type: string, maxLength: 3000 }
        area: { type: string, enum: [business, fitness, english, personal] }
        priority: { type: string, enum: [high, medium, low] }
        targetDate: { type: string }
        summary: { type: string, maxLength: 3000 }
        rationale: { type: string, maxLength: 3000 }
        reason: { type: string, maxLength: 3000 }
        dueDate: { type: string }
        plannedDate: { type: string }
        effort: { type: number, minimum: 0, maximum: 10080 }
        notes: { type: string, maxLength: 5000 }
        recurrence: { type: string, enum: [none, daily, weekly, monthly] }
        reminder: { type: string }
        status: { type: string, enum: [active, paused, completed, cancelled, open, done] }
        done: { type: boolean }
        weekStart: { type: string }
        focus: { type: string, maxLength: 3000 }
        capacityMinutes: { type: number, minimum: 0, maximum: 10080 }
        taskIds: { type: array, maxItems: 100, items: { type: string } }
        metricId: { type: string }
        name: { type: string }
        unit: { type: string }
        kind: { type: string, enum: [outcome, leading] }
        baseline: { type: number }
        target: { type: number }
        value: { type: number }
        date: { type: string }
        reviewType: { type: string, enum: [weekly, monthly] }
        periodStart: { type: string }
        periodEnd: { type: string }
        wins: { type: string, maxLength: 5000 }
        misses: { type: string, maxLength: 5000 }
        learned: { type: string, maxLength: 5000 }
        change: { type: string, maxLength: 5000 }
    AiMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, maxLength: 12000 }
    AiConversationInput:
      type: object
      required: [message, context]
      properties:
        message: { type: string, minLength: 1, maxLength: 5000 }
        messages: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AiMessage" } }
        context: { type: object, additionalProperties: true }
        proposals: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/AiOperation" } }
    AiApprovalInput:
      type: object
      required: [requestId, operations, state]
      properties:
        requestId: { type: string, minLength: 8, maxLength: 150 }
        operations: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/AiOperation" } }
        state: { type: object, additionalProperties: true }
    AiApprovalResult:
      type: object
      required: [state, changes, alreadyApplied]
      properties:
        state: { type: object, additionalProperties: true }
        changes: { type: array, items: { type: string } }
        alreadyApplied: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

